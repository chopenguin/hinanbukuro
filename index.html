<title>避難包帖 — 防災用品與有效期限帖</title>
<meta name="description" content="掃條碼或拍照辨識把防災用品收進避難包、記下有效期限，約好集合點，一鍵用 GPS 傳報平安簡訊。資料只留在你自己的裝置。">
<meta name="theme-color" content="#f6f4ef" id="metaThemeColor">
<meta name="color-scheme" content="light dark">
<script>
(function () {
  try {
    var raw = localStorage.getItem('hinanbukuro.v1');
    if (raw) {
      var parsed = JSON.parse(raw);
      var t = parsed && parsed.settings && parsed.settings.theme;
      if (t === 'light' || t === 'dark') {
        document.documentElement.dataset.theme = t;
        var m = document.getElementById('metaThemeColor');
        if (m) m.content = t === 'dark' ? '#121110' : '#f6f4ef';
      }
    }
  } catch (e) {}
})();
</script>
